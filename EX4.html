<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APPLICATION</title>
</head>
<style>
    body{
        text-align: center;
    }
    .form-group {
    display: flex;
    align-items: flex-start;
    margin-bottom: 30px;
}

.form-group > label {
    width: 400px;
    text-align: right;
    margin-right: 15px;
    font-size: 20px;
}

select {
    width: 185px;
    height: 45px;
    padding: 8px;
    font-size: 16px;
}

.checkbox-group {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.checkbox-group label {
    width: auto;
    text-align: left;
    margin: 0;
    font-size: 20px;
}

.checkbox-group input {
    width: 18px;
    height: 18px;
}

textarea {
    width: 360px;
    height: 80px;
    padding: 10px;
    font-size: 17px;
    box-sizing: border-box;
}

.comments {
    margin-top: 65px;
}
</style>
<body>
    <h1>APPLICATION FORM</h1>
    <p>
        Thank you for your interest in working with us. Please check below for available job opportunities that meeting your criteria and send your application by filling out the Job Application Form.
    </p>
     <div class="form-group">
        <label for="fullname">* Full Name:</label>
        <input type="text" id="fullname" placeholder="Enter your full name">
    </div>

    <div class="form-group">
        <label for="email">* Email:</label>
        <input type="email" id="email" placeholder="Enter your Email">
    </div>

    <div class="form-group">
        <label for="age">* Age:</label>
        <input type="number" id="age" placeholder="Age">
    </div>

    <div class="form-group">
        <label for="role">Which option best describes your current role?</label>

        <select id="role">
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
            <option value="staff">Employee</option>
            <option value="other">Other</option>
        </select>
    </div>
    <div class="form-group">
    <label>* Would you like to list references?</label>

    <div class="radio-group">
        <div>
            <span>Yes</span>
            <input type="radio" name="references" value="yes">
        </div>

        <div>
            <span>No</span>
            <input type="radio" name="references" value="no">
        </div>
    </div>
</div>
<div class="form-group">
    <label for="position">Which position would you like to apply for?</label>

    <select id="position" name="position">
        <option value="">Select an option</option>
        <option value="developer">Developer</option>
        <option value="designer">Designer</option>
        <option value="data">Data Analyst</option>
    </select>
</div>


<div class="form-group">
    <label>Which programming languages do you know?</label>

    <div class="checkbox-group">
        <label>
            <input type="checkbox" name="language" value="java">
            Java
        </label>

        <label>
            <input type="checkbox" name="language" value="python">
            Python
        </label>

        <label>
            <input type="checkbox" name="language" value="javascript">
            JavaScript
        </label>

        <label>
            <input type="checkbox" name="language" value="cpp">
            C++
        </label>

        <label>
            <input type="checkbox" name="language" value="swift">
            Swift
        </label>

        <label>
            <input type="checkbox" name="language" value="ruby">
            Ruby
        </label>

        <label>
            <input type="checkbox" name="language" value="dotnet">
            .NET
        </label>
    </div>
</div>


<div class="form-group comments">
    <label for="comments">Any Comments?</label>

    <textarea
        id="comments"
        name="comments"
        placeholder="Enter your comment here..."
    ></textarea>
</div>

    
</body>
</html>
