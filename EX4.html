<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APPLICATION</title>
</head>
<style>
    body{
      text-align: center;
    }
</style>
<body>
    <h1>APPLICATION FORM</h1>
    <p>
        Thank you for your interest in working with us. Please check below for available job opportunities that meeting your criteria and send your application by filling out the Job Application Form.
    </p>
    <label for="Name">* Full Name: </label>
    <input type="text">
    <br><br>
    <label for="Email">* Email: </label>
    <input type="email">
    <br><br>
    <label for="Age">* Age: </label>
    <input type="number">
    <br><br>
    <label for="role">Which option best describes your current role?</label>
    <select name="role">
        <option>Student</option>
        <option>Teacher</option>
        <option>Staff</option>
        <option>Someone else</option>
    </select>
    <br><br>
    <label for="reference">* Whould you like to list reference?</label>
    <input type="radio" name="reference">Yes
    <br>
    <input type="radio" name="reference">No
    <br>
    <label for="position">Which position would you like to apply for?</label>
    <select name="position">
        <option>Data Science</option>
        <option>Software Engineering</option>
        <option>Telecom Network</option>
        <option>Other</option>
    </select>
    <br><br>
    <label for="languages">Which programming languages do you know?</label>
    <input type="checkbox">Java
    <br>
    <input type="checkbox">Python
    <br>
    <input type="checkbox">JavaScript
    <br>
    <input type="checkbox">C++
    <br>
    <input type="checkbox">Swift
    <br>
    <input type="checkbox">Ruby
    <br>
    <input type="checkbox">.NET
    <br><br>
    <label for="comment">Any comments?</label>
    <textarea name="comment" id="user-cmt">Enter your comment here...</textarea>
</body>
</html>
