<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link rel="stylesheet" href="Ex2.W2.css">
</head>
<body>
    <div class="profile-card">
        <div class="group">
            <img src="Pic-Ex2.W2.jpg" alt="">
        </div>
        <div class="group">
            <h2>Kim Hye-jun</h2>
            <span class="job">Korean Actress</span>
        </div>

        <div class="stats">
            <div class="info">
                <p>Projects</p>
                <span>20</span>
            </div>

            <div class="info">
                <p>Follower</p>
                <span>10M</span>
            </div>

            <div class="info">
                <p>Following</p>
                <span>0</span>
            </div>

        </div>
        <div class="bio">
            <p>A for apple</p>
        </div>
        <div class="social">
            <i class="fa-brands fa-facebook-f"></i>
            <i class="fa-brands fa-instagram"></i>
            <i class="fa-brands fa-tiktok"></i>
        </div>
        <button>View Profile</button>
    </div>
</body>
</html>
